<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Dropdown Examples</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="p-5">

  <!-- Basic Dropdown -->
  <h4>Basic Dropdown Menu</h4>
  <div class="dropdown mb-4">
    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
      City
    </button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Rajkot</a></li>
      <li><a class="dropdown-item" href="#">AMD</a></li>
      <li><a class="dropdown-item" href="#">Surat</a></li>
    </ul>
  </div>

  <!-- Right-Aligned Dropdown -->
  <h4>Right-Aligned Dropdown Menu</h4>
  <div class="btn-group mb-4">
    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      Right Menu
    </button>
    <ul class="dropdown-menu dropdown-menu-lg-end">
      <li><button class="dropdown-item" type="button">Profile</button></li>
    </ul>
  </div>

  <!-- Dropup Menu -->
  <h4>Dropup Menu</h4>
  <div class="dropup mb-4">
    <button class="btn btn-warning dropdown-toggle" type="button" data-bs-toggle="dropdown">
      Dropup
    </button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Action</a></li>
      <li><a class="dropdown-item" href="#">Another action</a></li>
    </ul>
  </div>

  <!-- Dropdown with Headers -->
  <h4>Dropdown Menu with Headers</h4>
  <div class="dropdown mb-4">
    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown">
      Header Menu
    </button>
    <ul class="dropdown-menu">
      <li><h6 class="dropdown-header">Select City</h6></li>
      <li><a class="dropdown-item" href="#">jnd</a></li>
      <li><a class="dropdown-item" href="#">rjt</a></li>
      <li><a class="dropdown-item" href="#">amd</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><h6 class="dropdown-header">Select Age</h6></li>
      <li><a class="dropdown-item" href="#">18</a></li>
    </ul>
  </div>

  <!-- Dropdown with Icons -->
  <h4>Dropdown Menu with Icons</h4>
  <div class="dropdown mb-4">
    <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown">
      Icon Menu
    </button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#"><i class="bi bi-person-square"></i>&nbsp;Profile</a></li>
      <li><a class="dropdown-item" href="#"><i class="bi bi-gear"></i>&nbsp;Settings</a></li>
      <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right"></i>&nbsp;Logout</a></li>
    </ul>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
