<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">Bootstrap Grid Example</h2>

        <!-- 1. Offset Box -->
        <div class="row mb-3">
            <div class="col-md-4 offset-md-4 bg-primary text-white text-center p-3">
                Offset Box
            </div>
        </div>

        <!-- 2. Box 1 -->
        <div class="row mb-3">
            <div class="col-md-6 mx-auto bg-success text-white text-center p-3">
                Box 1
            </div>
        </div>

        <!-- 3. Box 2 -->
        <div class="row mb-3">
            <div class="col-md-6 mx-auto bg-warning text-center p-3">
                Box 2
            </div>
        </div>

        <!-- 4. Parent Box with Child Boxes -->
        <div class="row mb-3">
            <div class="col-md-6 mx-auto bg-info text-white p-3 text-center">
                Parent Box
                <div class="row mt-3 text-dark">
                    <div class="col bg-light border text-center p-2">
                        Child 1
                    </div>
                    <div class="col bg-secondary text-white text-center p-2">
                        Child 2
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
