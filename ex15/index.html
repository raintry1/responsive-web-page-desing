<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Progress Bars</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Bootstrap Progress Bars</h2>

        <!-- A. Basic Progress Bars -->
        <h4>A. Basic Progress Bars</h4>
        <p>25% Progress</p>
        <div class="progress mb-3">
            <div class="progress-bar" style="width: 25%;"></div>
        </div>

        <p>50% Progress</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 50%;"></div>
        </div>

        <p>75% Progress</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-warning" style="width: 75%;"></div>
        </div>

        <!-- B. Progress Bar with Label -->
        <h4>B. Progress Bar with Label</h4>
        <div class="progress mb-4">
            <div class="progress-bar" style="width: 60%;">60%</div>
        </div>

        <!-- C. Multi-color Progress Bars -->
        <h4>C. Multi-color Progress Bar</h4>
        <div class="progress mb-4">
            <div class="progress-bar bg-success" style="width: 30%;">30%</div>
            <div class="progress-bar bg-warning" style="width: 30%;">30%</div>
            <div class="progress-bar bg-danger" style="width: 20%;">20%</div>
        </div>

        <!-- Striped Progress Bar -->
        <h4>Striped Progress Bar</h4>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped bg-success" style="width: 70%;">70%</div>
        </div>

        <!-- Animated Progress Bar -->
        <h4>Animated Progress Bar</h4>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 80%;">80%</div>
        </div>

        <!-- D. Dynamic Progress Bar -->
        <h4>D. Dynamic Progress Bar</h4>
        <div class="progress mb-3">
            <div id="dynamicBar" class="progress-bar bg-primary" style="width: 0%;">0%</div>
        </div>
        <button class="btn btn-primary" onclick="increaseProgress()">Increase Progress</button>
    </div>

    <script>
        let value = 0;

        function increaseProgress() {
            if (value < 100) {
                value = value + 10;
                document.getElementById("dynamicBar").style.width = value + "%";
                document.getElementById("dynamicBar").innerHTML = value + "%";
            }
        }
    </script>
</body>
</html>
