<!DOCTYPE html>
<html>
<head>
<title>Semester Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<h2 class="text-center mb-4">
Semester and Course Menu
</h2>
<!-- Button Toolbar -->
<div class="btn-toolbar justify-content-center">
<!-- Odd Semester Button Group -->
<div class="btn-group me-3">
<button class="btn btn-primary">
Odd Semester
</button>
<button class="btn btn-primary">
Sem 1
</button>
<button class="btn btn-primary">
Sem 3
</button>
<button class="btn btn-primary">
Sem 5
</button>
</div>
<!-- Even Semester Button Group -->
<div class="btn-group">
<button class="btn btn-success">
Even Semester
</button>
<button class="btn btn-success">
Sem 2
</button>
<button class="btn btn-success">
Sem 4
</button>

<button class="btn btn-success">
Sem 6
</button>
</div>
</div>
<hr>
<!-- Courses -->
<h4 class="text-center">Courses of Each Semester</h4>
<div class="row mt-4">
<!-- Semester 1 -->
<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-primary">Sem 1</button>
<button class="btn btn-outline-primary">Programming in C</button>
<button class="btn btn-outline-primary">Mathematics</button>
<button class="btn btn-outline-primary">Basic Computer</button>
</div>
</div>
<!-- Semester 2 -->
<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-success">Sem 2</button>
<button class="btn btn-outline-success">Data Structure</button>
<button class="btn btn-outline-success">Web Design</button>
<button class="btn btn-outline-success">Database</button>
</div>
</div>
<!-- Semester 3 -->
<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-primary">Sem 3</button>
<button class="btn btn-outline-primary">Data Structure</button>
<button class="btn btn-outline-primary">RDBMS</button>
<button class="btn btn-outline-primary">JavaScript</button>
</div>
</div>
<!-- Semester 4 -->
<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-success">Sem 4</button>
<button class="btn btn-outline-success">Computer Network</button>
<button class="btn btn-outline-success">Operating System</button>
<button class="btn btn-outline-success">Python</button>
</div>
</div>
<!-- Semester 5 -->

<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-primary">Sem 5</button>
<button class="btn btn-outline-primary">Project Management</button>
<button class="btn btn-outline-primary">Information Security</button>
<button class="btn btn-outline-primary">Software Engineering</button>
</div>
</div>
<!-- Semester 6 -->
<div class="col-md-4 mb-3">
<div class="btn-group-vertical w-100">
<button class="btn btn-success">Sem 6</button>
<button class="btn btn-outline-success">Artificial Intelligence</button>
<button class="btn btn-outline-success">Machine Learning</button>
<button class="btn btn-outline-success">Project</button>
</div>
</div>
</div>
</div>
</body>
</html>
